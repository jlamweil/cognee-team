name: verify-acl

# Proves the ACL tiering on every push - no LLM, no GPU, no secrets.
#
# Runs inside a python:3.11 container, NOT the bare ubuntu-latest runner,
# on purpose: the hosted prebuilt CPython on ubuntu-latest segfaults in the
# stdlib sqlite3/asyncio path during bootstrap (a native/ABI issue that does
# NOT reproduce with the identical pinned packages on a self-consistent base
# image). The container provides a CPython built against its own system
# libraries. See README "Verification story".
#
# Ephemeral roster + .env are generated from the committed templates
# (placeholder principals + randomly generated JWT secrets), so nothing
# sensitive ever enters the workspace.

on:
  push:
  pull_request:

jobs:
  verify-acl:
    runs-on: ubuntu-latest
    container: python:3.11
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Ensure git + TLS certs (container has no Node for actions/checkout)
        run: apt-get update && apt-get install -y -q git ca-certificates

      - name: Checkout
        run: |
          git config --global --add safe.directory /workspace
          git clone --depth 1 https://github.com/jlamweil/cognee-team.git /workspace
          cd /workspace
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"

      - name: Ephemeral roster/env from templates (throwaway state, no secrets)
        working-directory: /workspace
        run: |
          cp roster.template.json roster.json
          GEN=$(python -c "import secrets; print(secrets.token_hex(24))")
          sed -e "s|__DATA_ROOT__|/workspace|g" -e "s|__GENERATE__|ci-$GEN|g" .env.template > .env
          mkdir -p data/databases data/logs data/repos credentials

      - name: Install proven stack
        working-directory: /workspace
        run: |
          pip install --quiet \
            "cognee[api]==1.6.2" "fastembed==0.8.0" "onnxruntime==1.23.2" \
            "lancedb==0.39.0" "pylance==0.36.0" "pyarrow==25.0.1" "aiosqlite==0.22.1"

      - name: Bootstrap, start server, run verify.py (per-principal checks, LLM-free)
        working-directory: /workspace
        run: |
          python bootstrap.py
          python -m uvicorn cognee.api.client:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          timeout 90 bash -c 'until python -c "import urllib.request as u,sys; u.urlopen(sys.argv[1])" "http://127.0.0.1:8000/docs" 2>/dev/null; do sleep 2; done'
          python verify.py

      - name: Show server.log on failure
        if: failure()
        working-directory: /workspace
        run: cat server.log || true
